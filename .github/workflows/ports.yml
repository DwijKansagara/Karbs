name: macOS Linux Android previews
on:
  push:
    branches: [codex/platform-ports]
    paths: ['ports/**', '.github/workflows/ports.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: karbs-ports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS
            arch: arm64
            codex: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: macOS
            arch: x64
            codex: x86_64-apple-darwin
          - runner: ubuntu-22.04
            platform: Linux
            arch: x64
            codex: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ports
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ports/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ports -> target
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libsecret-1-dev librsvg2-dev patchelf xdg-utils xvfb espeak-ng
      - run: npm ci
      - run: npm run build
      - run: cargo test -p karbs-port-core --locked
      - run: node scripts/vendor-codex.mjs ${{ matrix.codex }}
      - name: Sign bundled macOS executable
        if: runner.os == 'macOS'
        run: codesign --force --sign - resources/codex/codex
      - run: npm run tauri -- build
      - name: Native Linux startup check
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/karbs-smoke"
          timeout 15s xvfb-run -a env KARBS_PORT_DATA="$RUNNER_TEMP/karbs-smoke" WEBKIT_DISABLE_DMABUF_RENDERER=1 target/release/karbs-port > "$RUNNER_TEMP/karbs-smoke.log" 2>&1 &
          PID=$!
          sleep 6
          kill -0 "$PID"
          wait "$PID" || test "$?" = 124
      - name: Native macOS bundle check
        if: runner.os == 'macOS'
        run: |
          APP=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict "$APP"
          mkdir -p "$RUNNER_TEMP/karbs-smoke"
          KARBS_PORT_DATA="$RUNNER_TEMP/karbs-smoke" "$APP/Contents/MacOS/karbs-port" > "$RUNNER_TEMP/karbs-smoke.log" 2>&1 &
          PID=$!
          sleep 6
          kill -0 "$PID"
          kill "$PID"
      - run: node scripts/collect-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Karbs-${{ matrix.platform }}-${{ matrix.arch }}
          path: ports/artifacts/*
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ports
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ports/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ports -> target
      - name: Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: node scripts/configure-android.mjs
      - run: npm run tauri -- android build --ci --apk --target aarch64 x86_64
      - run: node scripts/collect-artifacts.mjs android universal
      - name: Verify Android publisher signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose artifacts/Karbs_0.3.0_android.apk"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android startup and encrypted-key smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 ports/scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Karbs-Android
          path: ports/artifacts/*
          retention-days: 14
