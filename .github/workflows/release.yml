name: Signed Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      COUCOU_DATA_DIR: ${{ github.workspace }}/test-data
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Require a release signing key and matching version
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Release signing key is missing.' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version differ.' }
      - run: npm ci
      - run: npm run build
      - run: node --test tests/agents.test.mjs ../runtime/pc-control/server.test.mjs ../runtime/pc-control/gemini-agent.test.mjs
      - run: cargo test --lib -p coucou
      - run: npm run tauri -- build
      - run: node ../tools/release-assets.mjs target/release/bundle/nsis
      - name: Publish installers, signatures and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft' *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'This tag already has a release; leaving its published assets unchanged.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "Karbs $env:GITHUB_REF_NAME" --notes "Windows x64 release. Connect your own Codex or Gemini account. Optional voice setup is available in Settings." target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*.sig target/release/bundle/nsis/latest.json target/release/bundle/nsis/SHA256SUMS.txt
